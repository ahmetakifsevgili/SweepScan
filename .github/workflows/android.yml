# Unit tests (tracker, replay of field recordings, location map), lint and a debug build on every
# push and pull request. On-device tests (decode benchmark, screens, database migration) need a
# phone: tools\decode_bench.bat.
name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, debug APK
        run: ./gradlew --no-daemon :core:test :app:testFullDebugUnitTest :app:lintFullDebug :app:assembleFullDebug :app:assembleDosyaDebug
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SweepScan-debug
          path: app/build/outputs/apk/*/debug/*.apk
